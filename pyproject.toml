[project]
name = "kosh"
version = "0.0.1"
description = "Offline Indian share-market tax calculator"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "casparser>=1.4.1",
    "msoffcrypto-tool>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-github-actions-annotate-failures>=0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "importers"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["engine", "importers"]

[[tool.mypy.overrides]]
module = ["msoffcrypto", "msoffcrypto.*", "casparser", "casparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["engine", "importers"]

[tool.coverage.report]
fail_under = 90
show_missing = true
